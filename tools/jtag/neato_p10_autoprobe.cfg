# Neato Cruz Rev113 P10 read-only JTAG autoprobe interface.
#
# This file deliberately declares only the Mac-side adapter and transport.
# It does not declare a TAP, target, reset line, memory map, or programming
# helper. Run it with:
#
#   openocd -f tools/jtag/neato_p10_autoprobe.cfg \
#     -c "init; scan_chain; shutdown"
#
# OpenOCD 0.12 on Manny's Mac did not accept the CherryDAP usb_bulk backend
# selector, so no cmsis-dap backend line is included.

adapter driver cmsis-dap
transport select jtag
adapter speed 10
