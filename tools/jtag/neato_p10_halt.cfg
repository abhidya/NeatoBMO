# P10 JTAG halt-and-dump config for the Cruz Rev113 (ARM926 / AT91SAM9XE).
#
# Read-only intent: halt the core and dump internal SRAM (where software-AES
# round keys sit during boot decrypt) and external SDRAM (0x20000000, where
# the decrypted application lands).  No flash writes, no GPNVM, no erase.
#
# PREREQUISITE: `scan_chain` must first return a stable IDCODE.  If it prints
# "JTAG scan chain interrogation failed: all ones", stop and fix the wiring --
# that signature means TDO is floating high OR nTRST is holding the TAP in
# reset.  Do not proceed to halt until an IDCODE is visible.

adapter driver cmsis-dap
transport select jtag
adapter speed 10

# AT91SAM9XE = ARM926EJ-S core. The caller must supply values repeated by an
# earlier adapter-only scan; this file intentionally has no guessed fallback.
if { ![info exists CPUTAPID] } { error "set CPUTAPID from a stable measured TAP before using this config" }
if { ![info exists CPUIRLEN] } { error "set CPUIRLEN from a stable measured TAP before using this config" }
set _CPUTAPID $CPUTAPID
set _CPUIRLEN $CPUIRLEN
if { [info exists CHIPNAME] } { set _CHIPNAME $CHIPNAME } else { set _CHIPNAME at91sam9xe }

jtag newtap $_CHIPNAME cpu -irlen $_CPUIRLEN -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME arm926ejs -endian little -chain-position $_TARGETNAME

# Work area in the second internal SRAM bank.  Confirm exact size from the
# datasheet; 16 KiB is a safe request.
$_TARGETNAME configure -work-area-phys 0x00300000 -work-area-size 0x4000 -work-area-backup 0

# No reset wiring or reset policy is configured by this file.
