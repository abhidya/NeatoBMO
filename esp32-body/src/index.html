<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neato Body</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0e14; color:#d5dbe5;
         font:14px -apple-system,sans-serif; display:flex; height:100vh; }
  #left { flex:1; display:flex; flex-direction:column; align-items:center; padding:8px; min-width:0; }
  #right { width:400px; display:flex; flex-direction:column; border-left:1px solid #232a36; }
  canvas { max-width:100%; flex:1; min-height:0; }
  #hud { padding:6px; }
  .val { color:#4cc38a; font-weight:600; }
  #console { flex:1; overflow-y:auto; font:12px ui-monospace,monospace;
             padding:8px; white-space:pre-wrap; word-break:break-all; }
  #cmd { width:100%; background:#11151d; color:#d5dbe5; border:0; border-top:1px solid #232a36;
         padding:10px; font:13px ui-monospace,monospace; outline:none; }
  button { background:#1a2230; color:#d5dbe5; border:1px solid #2c3547; border-radius:6px;
           padding:6px 10px; margin:2px; cursor:pointer; font-size:12px; }
  button:hover { background:#243046; }
  #quick { padding:6px; border-bottom:1px solid #232a36; }
  #soundboard { border-bottom:1px solid #232a36; padding:8px; max-height:48%; overflow:auto; }
  #soundbar { display:flex; gap:6px; position:sticky; top:0; background:#0b0e14; padding-bottom:7px; z-index:2; }
  #soundsearch { min-width:0; flex:1; background:#11151d; color:#d5dbe5; border:1px solid #2c3547;
                 border-radius:7px; padding:7px; }
  #soundfilter { background:#11151d; color:#d5dbe5; border:1px solid #2c3547; border-radius:7px; }
  #sounds { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
  .sound { text-align:left; padding:8px; margin:0; min-height:56px; display:flex; flex-direction:column; gap:3px; }
  .sound small { color:#8a96a8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .soundrow { display:flex; gap:4px; }
  .soundrow .sound { flex:1; }
  .preview { width:34px; padding:4px; margin:0; }
  #soundstate { color:#8a96a8; font-size:12px; min-height:18px; padding:2px 0 6px; }
  details { font-size:11px; color:#8a96a8; margin-top:6px; }
  #catalogurl { width:100%; background:#11151d; color:#d5dbe5; border:1px solid #2c3547;
                border-radius:5px; padding:5px; margin-top:4px; }
  #status { padding:6px 10px; font-weight:600; }
  .ok { color:#4cc38a; } .bad { color:#e06c75; }
  #drive { text-align:center; padding:6px; }
  #files { border-bottom:1px solid #232a36; padding:8px; }
  #filestate { color:#8a96a8; font-size:12px; min-height:16px; display:block; }
  #filelist a { display:block; color:#4cc38a; text-decoration:none; font-size:12px;
                padding:2px 0; word-break:break-all; }
  #filelist a:hover { text-decoration:underline; }
  @media (max-width: 700px) { body { flex-direction:column; } #right { width:100%; height:45%; } }
</style>
<div id="left">
  <div id="hud">RPM <span class="val" id="rpm">-</span> · points <span class="val" id="npts">-</span>
    <button onclick="lidar(true)">Lidar ON</button>
    <button onclick="lidar(false)">Lidar OFF</button></div>
  <canvas id="c" width="900" height="900"></canvas>
  <div id="drive">
    <button onclick="drive(200,200)">▲</button><br>
    <button onclick="drive(-80,80)">◀</button>
    <button onclick="send('SetMotor 0 0 0')">■</button>
    <button onclick="drive(80,-80)">▶</button><br>
    <button onclick="drive(-200,-200)">▼</button>
  </div>
</div>
<div id="right">
  <div id="status">robot: <span id="conn" class="bad">…</span>
    <a href="/wifi" style="float:right;color:#5b6676;text-decoration:none">wifi ⚙</a></div>
  <div id="quick">
    <button onclick="send('GetVersion')">GetVersion</button>
    <button onclick="send('GetCharger')">GetCharger</button>
    <button onclick="send('TestMode On')">TestMode On</button>
    <button onclick="send('TestMode Off')">TestMode Off</button>
    <button onclick="send('GetAnalogSensors')">Analog</button>
    <button onclick="send('GetDigitalSensors')">Digital</button>
    <button onclick="send('PlaySound 1')">Beep</button>
    <button onclick="send('Help')">Help</button>
  </div>
  <div id="files">
    <button onclick="loadFiles()">📄 decrypted software</button>
    <span id="filestate"></span>
    <div id="filelist"></div>
  </div>
  <section id="soundboard">
    <div id="soundbar">
      <input id="soundsearch" placeholder="Search 230 BMO sounds…" autocomplete="off">
      <select id="soundfilter">
        <option value="all">All</option>
        <option value="official">Official</option>
        <option value="community">Community</option>
      </select>
    </div>
    <div id="soundstate">Loading sound catalog…</div>
    <div id="sounds"></div>
    <details><summary>Sound data source</summary>
      <input id="catalogurl" spellcheck="false">
      <button onclick="saveCatalogUrl()">Reload</button>
    </details>
  </section>
  <div id="console"></div>
  <input id="cmd" placeholder="type any Neato command, Enter to send">
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let maxR=4000;
function draw(scan){const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-20;
 ctx.fillStyle='#0b0e14';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#232a36';ctx.fillStyle='#5b6676';ctx.font='12px sans-serif';
 for(let m=1000;m<=maxR;m+=1000){ctx.beginPath();ctx.arc(cx,cy,R*m/maxR,0,7);ctx.stroke();
  ctx.fillText((m/1000)+' m',cx+R*m/maxR+4,cy-4);}
 ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();
 ctx.fillStyle='#e5c07b';ctx.beginPath();ctx.moveTo(cx,cy-10);ctx.lineTo(cx-7,cy+8);ctx.lineTo(cx+7,cy+8);ctx.closePath();ctx.fill();
 let n=0;
 for(const[aS,d]of Object.entries(scan)){if(d<=0||d>maxR)continue;
  const a=(parseInt(aS)-90)*Math.PI/180,r=R*d/maxR;
  ctx.fillStyle='#4cc38a';ctx.beginPath();ctx.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),3,0,7);ctx.fill();n++;}
 document.getElementById('npts').textContent=n;}

let ws, buf='', pollLidar=false;
const con=document.getElementById('console');
function log(t){con.textContent=(con.textContent+t).split('\\n').slice(-300).join('\\n');con.scrollTop=con.scrollHeight;}
function connect(){
 if(window.BMO_SIMULATOR){const el=document.getElementById('conn');el.textContent='simulator · robot offline';el.className='';return;}
 ws=new WebSocket(`ws://${location.host}/ws`);
 ws.onopen=()=>{setConn(true);};
 ws.onclose=()=>{setConn(false);setTimeout(connect,2000);};
 ws.onmessage=e=>{buf+=e.data;
  let i;
  while((i=buf.indexOf('\\x1a'))>=0){handleBlock(buf.slice(0,i));buf=buf.slice(i+1);}
  if(buf.length>40000)buf=buf.slice(-20000);};
}
function setConn(ok){const el=document.getElementById('conn');
 el.textContent=ok?'link up':'link down';el.className=ok?'ok':'bad';}
function handleBlock(block){
 if(block.trimStart().startsWith('GetLDSScan')){
  const pts={};let rpm=0;
  for(const line of block.split('\\n')){const p=line.trim().split(',');
   if(p[0]==='ROTATION_SPEED')rpm=parseFloat(p[1])||0;
   else if(p.length===4&&/^\\d+$/.test(p[0])){
    const a=+p[0],d=+p[1],err=+p[3];
    if(err===0&&d>0&&d<10000)pts[a]=d;}}
  if(Object.keys(pts).length){draw(pts);document.getElementById('rpm').textContent=rpm.toFixed(1);}
 } else if(block.trim()) log(block+'\\n');
}
function send(c){if(ws&&ws.readyState===1)ws.send(c);log('> '+c+'\\n');}
function drive(l,r){send('TestMode On');send(`SetMotor ${l} ${r} 100`);}
function lidar(on){pollLidar=on;
 if(on){send('TestMode On');send('SetLDSRotation On');}
 else send('SetLDSRotation Off');}
setInterval(()=>{if(pollLidar&&ws&&ws.readyState===1)ws.send('GetLDSScan');},450);
const cmdEl=document.getElementById('cmd');
cmdEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&cmdEl.value.trim()){send(cmdEl.value.trim());cmdEl.value='';}});
// Precompiled sound modules. GitHub Pages serves only catalog.json + .bin;
// browser preview decodes PCM directly out of the same binary sent to Neato.
const DEFAULT_CATALOG=window.BMO_CATALOG_URL||'https://abhidya.github.io/NeatoBMO/bmo-soundboard/catalog.json';
const soundState=document.getElementById('soundstate'),soundsEl=document.getElementById('sounds'),
      soundSearch=document.getElementById('soundsearch'),soundFilter=document.getElementById('soundfilter'),
      catalogInput=document.getElementById('catalogurl');
let soundCatalog=[],catalogUrl='',soundPoll=null,audioContext=null;
const moduleCache=new Map();
function selectedCatalogUrl(){if(window.BMO_SIMULATOR)return DEFAULT_CATALOG;
 try{return localStorage.getItem('bmoCatalogUrl')||DEFAULT_CATALOG}catch(e){return DEFAULT_CATALOG}}
function saveCatalogUrl(){const value=catalogInput.value.trim();
 try{if(value)localStorage.setItem('bmoCatalogUrl',value);else localStorage.removeItem('bmoCatalogUrl')}catch(e){}
 loadSoundCatalog();}
function catalogModuleUrl(sound){return new URL(sound.module,catalogUrl).href;}
function soundKind(sound){return sound.verification.startsWith('official-')?'official':'community';}
function renderSounds(){const query=soundSearch.value.trim().toLowerCase(),filter=soundFilter.value;
 const matches=soundCatalog.filter(s=>(filter==='all'||soundKind(s)===filter)&&
  (!query||`${s.label} ${s.key} ${s.category||''}`.toLowerCase().includes(query)));
 soundsEl.innerHTML='';
 for(const sound of matches){const row=document.createElement('div');row.className='soundrow';
  const play=document.createElement('button');play.className='sound';
  const title=document.createElement('span');title.textContent=sound.label;
  const meta=document.createElement('small');meta.textContent=`${soundKind(sound)} · ${sound.content_seconds.toFixed(1)}s`;
  play.append(title,meta);play.onclick=()=>playRobotSound(sound);
  const preview=document.createElement('button');preview.className='preview';preview.textContent='◉';
  preview.title='preview in this browser';preview.onclick=()=>previewSound(sound);
  row.append(play,preview);soundsEl.appendChild(row);}
 soundState.textContent=`${matches.length} of ${soundCatalog.length} sounds`;
}
async function loadSoundCatalog(){catalogUrl=selectedCatalogUrl();catalogInput.value=catalogUrl;
 soundState.textContent='Loading sound catalog…';soundsEl.innerHTML='';
 try{const response=await fetch(catalogUrl,{cache:'no-cache'});if(!response.ok)throw Error(`HTTP ${response.status}`);
  const catalog=await response.json();soundCatalog=catalog.sounds||[];renderSounds();
 }catch(error){soundState.textContent=`Catalog unavailable: ${error.message}`;}}
function sha256Fallback(bytes){const K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
 const H=new Uint32Array([1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225]),length=bytes.byteLength,padded=((length+9+63)>>6)<<6,data=new Uint8Array(padded);data.set(new Uint8Array(bytes));data[length]=128;const bitLength=length*8;for(let i=0;i<8;i++)data[padded-1-i]=Math.floor(bitLength/2**(8*i))&255;
 const w=new Uint32Array(64),rotr=(x,n)=>(x>>>n)|(x<<(32-n));for(let offset=0;offset<padded;offset+=64){for(let i=0;i<16;i++){const p=offset+i*4;w[i]=(data[p]<<24)|(data[p+1]<<16)|(data[p+2]<<8)|data[p+3];}for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2],s0=rotr(a,7)^rotr(a,18)^(a>>>3),s1=rotr(b,17)^rotr(b,19)^(b>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}let[a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const s1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+s1+ch+K[i]+w[i])>>>0,s0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(s0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;}return Array.from(H,n=>n.toString(16).padStart(8,'0')).join('');}
async function moduleSha256(bytes){if(window.crypto&&crypto.subtle){const hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');}return sha256Fallback(bytes);}
async function fetchModule(sound){const url=catalogModuleUrl(sound);if(moduleCache.has(url))return moduleCache.get(url);
 const response=await fetch(url);if(!response.ok)throw Error(`module HTTP ${response.status}`);
 const bytes=await response.arrayBuffer();if(bytes.byteLength!==770048)throw Error(`bad module size ${bytes.byteLength}`);
 const marker=new Uint8Array(bytes,0,2);if(marker[0]!==75||marker[1]!==84)throw Error('module lacks KT marker');
 const actual=await moduleSha256(bytes);if(actual!==sound.module_sha256)throw Error('module SHA-256 mismatch');
 moduleCache.set(url,bytes);if(moduleCache.size>3)moduleCache.delete(moduleCache.keys().next().value);return bytes;}
async function previewSound(sound){soundState.textContent=`Previewing ${sound.label}…`;
 try{const module=await fetchModule(sound),view=new DataView(module);
  const total=sound.segments.reduce((n,s)=>n+s.content_bytes/2,0),pcm=new Float32Array(total);let at=0;
  for(const segment of sound.segments)for(let offset=0;offset<segment.content_bytes;offset+=2)
   pcm[at++]=view.getInt16(segment.pcm_offset+offset,true)/32768;
  audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)({sampleRate:22050});
  const buffer=audioContext.createBuffer(1,pcm.length,22050);buffer.copyToChannel(pcm,0);
  const source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);source.start();
  soundState.textContent=`Browser preview · ${sound.label}`;
 }catch(error){soundState.textContent=`Preview failed: ${error.message}`;}}
async function playRobotSound(sound){soundState.textContent=`Queueing ${sound.label}…`;
 try{const response=await fetch('/soundboard/play',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({url:catalogModuleUrl(sound),sha256:sound.module_sha256,key:sound.key,
    slots:sound.slots,slot_seconds:sound.slot_seconds})});
  const result=await response.json();if(response.status===409){if(!soundPoll)soundPoll=setInterval(pollSoundStatus,700);pollSoundStatus();return;}
  if(!response.ok||result.error)throw Error(result.error||`HTTP ${response.status}`);
  if(!soundPoll)soundPoll=setInterval(pollSoundStatus,700);pollSoundStatus();
 }catch(error){soundState.textContent=`Play failed: ${error.message}`;}}
async function pollSoundStatus(){try{const status=await(await fetch('/soundboard/status')).json();
 const labels={queued:'Queued',downloading:'Downloading module',installing:'Installing module',playing:'Playing',
  ready:'Ready',error:'Error',idle:'Ready'};let line=labels[status.state]||status.state;
 if(status.key)line+=` · ${soundCatalog.find(s=>s.key===status.key)?.label||status.key}`;
 if(status.state==='playing')line+=` · part ${status.slot_index+1}/${status.slot_count}`;
 if(status.reused_module)line+=' · module already installed';if(status.error)line+=` · ${status.error}`;
 soundState.textContent=line;
 if(['queued','downloading','installing','playing'].includes(status.state)&&!soundPoll)soundPoll=setInterval(pollSoundStatus,700);
 if(!['queued','downloading','installing','playing'].includes(status.state)&&soundPoll){clearInterval(soundPoll);soundPoll=null;}
 }catch(error){soundState.textContent=`Status unavailable: ${error.message}`;}}
async function loadFiles(){
 const state=document.getElementById('filestate'),list=document.getElementById('filelist');
 state.textContent='Loading…';list.innerHTML='';
 try{const r=await fetch('/files');if(!r.ok)throw Error('HTTP '+r.status);
  const files=await r.json();
  if(!Array.isArray(files)||!files.length){state.textContent='No decrypted files yet.';return;}
  state.textContent=files.length+' file'+(files.length>1?'s':'')+':';
  for(const f of files){const a=document.createElement('a');
   a.textContent=`${f.name} (${f.size} B)`;a.href='/file?name='+encodeURIComponent(f.name);
   list.appendChild(a);}
 }catch(error){state.textContent='Files unavailable: '+error.message;}}
soundSearch.addEventListener('input',renderSounds);soundFilter.addEventListener('change',renderSounds);
connect();
loadSoundCatalog();
pollSoundStatus();
loadFiles();
</script>
